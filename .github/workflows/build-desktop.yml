# 打包 macOS / Windows 桌面端安装包。
# - 手动触发: Actions 页面 -> Build Desktop -> Run workflow
# - 发版触发: 推送 v* 标签 (如 v0.1.0) 时自动创建 GitHub Release 并附上安装包
# 复用本地打包脚本 scripts/package.sh / scripts/package.ps1，行为与本地一致。
name: Build Desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: macOS (arm64)
    runs-on: macos-14
    env:
      # 未配置开发者证书，跳过签名探索，避免构建失败
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: 安装 Python 依赖 (运行时 + PyInstaller)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-build.txt
          echo "PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: 打包 (后端测试 -> PyInstaller -> electron-builder)
        run: bash scripts/package.sh

      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: shell-helper-macos-arm64
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: 安装 Python 依赖 (运行时 + PyInstaller)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-build.txt
          echo "PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: 打包 (后端测试 -> PyInstaller -> electron-builder)
        shell: powershell
        run: ./scripts/package.ps1

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: shell-helper-windows-x64
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
